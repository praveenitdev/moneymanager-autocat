# kb_hyderabad.toml - regional pack: India / Telangana / Hyderabad merchants, utilities and
# local conventions. Loaded BEFORE kb.toml (first match wins), so local patterns take priority.
# Same format as kb.toml. Rules whose categories you don't have are skipped silently.
# Keep it generic (public merchants/institutions only) - no personal names.

# ======================================================================= FLAGS
[[rule]]
name = "flag: wallet / FASTag / prepaid top-up"
type = "expense"
match = 'ADD\s*MONEY|WALLET\s*(?:LOAD|TOP\s*-?UP)|TOP\s*-?UP\s*(?:WALLET|BALANCE)|LOAD\s*MONEY'
exclude = 'FEE|CHARGE|COST|CONVENIENCE'
flag = "wallet top-up - should be a Transfer to the wallet account (spend from the wallet is the expense)"

[[rule]]
name = "flag: mutual fund / demat / stock broker"
type = "expense"
match = 'ZERODHA|GROWW|UPSTOX|ANGEL\s*(?:ONE|BROKING)|KITE\b|\bBSE\s*STAR|NSE\s*CLEARING|ICCL|NSDL|\bCDSL\b|MF\s*UTILITIES|COIN\s*BY\s*ZERODHA|KUVERA|PAYTM\s*MONEY|SMALLCASE|HDFC\s*SEC|ICICI\s*DIRECT|5PAISA'
flag = "investment - should be a Transfer to the investment account"

[[rule]]
name = "flag: income that is a redemption / withdrawal from investments"
type = "income"
match = 'REDEMPTION|REDEEM|WITHDRAWAL\s*FROM|SWEEP|PARTIAL\s*WITHDRAW|ZERODHA|GROWW|UPSTOX|SELL\s*ORDER'
flag = "redemption - should be a Transfer from the investment account (only the gain is income)"

# ======================================================================= UTILITIES (Telangana)
[[rule]]
name = "reg Utilities: Telangana electricity (TGSPDCL/TGNPDCL)"
type = "expense"
match = 'TGSPDCL|TGNPDCL|TSSPDCL|TSNPDCL|TELANGANA\s*(?:STATE\s*)?(?:SOUTHERN|NORTHERN)?\s*POWER|SOUTHERN\s*POWER\s*DISTRIBUTION|NORTHERN\s*POWER\s*DISTRIBUTION|CESC\b|TSEB|TGEB|MESCOM|BESCOM|APEPDCL|APCPDCL'
