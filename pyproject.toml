[project]
name = "moneymanager-autocat"
version = "0.2.0"
description = "Safe, context-aware auto-categoriser for Realbyte Money Manager (via a money-manager MCP server)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["mcp>=1.0", "tomli>=2.0; python_version < '3.11'"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
