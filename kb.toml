[[rule]]
name = "kb Income: FD interest"
type = "income"
match = 'FD\s*INT|FIXED\s*DEPOSIT|DEPOSIT\s*INTEREST|RD\s*INT|MATURITY'
category = "Interest"
subcategory = "FD & Deposits"
confidence = "medium"

[[rule]]
name = "kb Income: dividends"
type = "income"
match = 'DIVIDEND|\bDIV\b'
category = "Investment Gain"
subcategory = "Dividends"

[[rule]]
name = "kb Income: income-tax refund"
type = "income"
match = 'INCOME\s*TAX\s*REFUND|ITD\s*REFUND|TAX\s*REFUND|CPC\s*REFUND|CBDT'
category = "Tax Refund"

[[rule]]
name = "kb Income: travel refund"
type = "income"
match = 'MAKEMYTRIP|GOIBIBO|CLEARTRIP|YATRA|IRCTC|REDBUS|ABHIBUS|INDIGO|AIR\s*INDIA'
max_amount = 60000
category = "Refunds"
subcategory = "Travel"
confidence = "medium"

[[rule]]
name = "kb Income: generic refund / reversal"
type = "income"
match = 'REFUND|REVERSAL|REVERSED|CHARGEBACK|RETURNED|CANCELL?ED\s*ORDER|REV\s*OF'
max_amount = 20000
category = "Refunds"
subcategory = "Other"
confidence = "medium"

[[rule]]
name = "kb Income: cashback / rewards"
type = "income"
match = 'CASHBACK|CASH\s*BACK|REWARD|SUPERCOIN|CRED\s*(?:COINS|CASH)|EXTRA\s*CREDIT|BONUS\s*CREDIT|SODEXO|CASHKARO|PHONEPE\s*REWARD'
max_amount = 5000
category = "Cashback & Rewards"

[[rule]]
name = "kb Income: freelance / consulting"
type = "income"
match = 'CONSULT|FREELANCE|INVOICE'
category = "Consulting & Freelance"
confidence = "medium"
