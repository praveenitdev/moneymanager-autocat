# kb.toml - built-in knowledge base of Indian merchants / bank-statement patterns.
# Lower priority than rules.toml. Rules whose category you don't have are skipped silently,
# so this adapts to your own category tree. confidence: "high" = applied by default,
# "medium" = goes to the review CSV. `flag = "why"` = list for manual handling, never changed.
# Same fields as rules.toml (match, exclude, pay_type, not_pay_type, min/max_amount, ...).

# =========================================================================== FLAGS (transfers etc.)
[[rule]]
name = "flag: credit-card bill payment"
type = "expense"
match = 'CREDIT\s*CARD\s*BILL|CC\s*BILL|CARD\s*BILL|CRED\s*(?:PAYMENT|CLUB)|BILLDESK.*CARD|PAYMENT.*TO.*CARD'
flag = "card bill / repayment - should be a Transfer to the card account"

[[rule]]
name = "flag: EMI principal / foreclosure"
type = "expense"
match = 'EMI\s*PRINCIPAL|FORECLOS|PRE-?CLOSURE|LOAN\s*REPAYMENT|PRINCIPAL\s*REPAY'
flag = "loan principal - should be a Transfer to the loan account (only interest/fees are expense)"

[[rule]]
name = "flag: cash withdrawal"
type = "expense"
match = '\bATM\b.*(?:WDL|WITHDRAW|CASH)|CASH\s*WITHDRAW|NWD-|CASH\s*WDL'
flag = "cash withdrawal - should be a Transfer to Cash"

[[rule]]
name = "flag: gold / investment purchase"
type = "expense"
match = 'SPARKLE|DIGITAL\s*GOLD|SAFEGOLD|AUGMONT|MMTC|GOLD\s*(?:BUY|PURCHASE)|ZERODHA|GROWW|UPSTOX|INDMONEY|\bCOIN\b.*ZERODHA|MUTUAL\s*FUND|\bSIP\b|NPS\s*TIER|OLYMP'
flag = "investment purchase - should be a Transfer to the investment account"

[[rule]]
name = "flag: untracked / opening balance placeholders"
type = "expense"
match = 'UNTRACKED|OPENING\s*BALANCE|SOURCE\s*TO\s*CONFIRM|BALANCE\s*ADJUST'
flag = "placeholder / balance adjustment - not a real expense"

[[rule]]
name = "flag: income that is really a transfer / deposit"
type = "income"
match = 'UNTRACKED|CASH\s*DEPOSIT|OPENING\s*BALANCE|SOURCE\s*TO\s*CONFIRM|SELF\s*TRANSFER|OWN\s*ACCOUNT'
flag = "placeholder / cash deposit - should be a Transfer, not income"

[[rule]]
name = "flag: unknown UPI payee"
type = "expense"
match = 'UPI\s*OUT\s*PAYEE\s*UNKNOWN|PAYEE\s*UNKNOWN'
flag = "payee unknown - identify from your bank app (SMS has no merchant)"

